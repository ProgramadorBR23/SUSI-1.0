<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marcar Consulta - SUSi!</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* CSS do formulário de marcar consulta */
        .main-container {
            max-width: 900px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .aviso-ilustrativo {
            background-color: #fef3c7;
            border: 1px solid #fde68a;
            color: #92400e;
            padding: 15px 20px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 25px;
            font-size: 0.95rem;
        }

        .card-passos {
            background: #ffffff;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05);
            border: 1px solid #e2e8f0;
        }

        .progresso-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: #64748b;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .barra-progresso-fundo {
            background: #e2e8f0;
            height: 8px;
            border-radius: 4px;
            margin-bottom: 25px;
            overflow: hidden;
        }

        .barra-progresso-preenchimento {
            background: #0088cc;
            height: 100%;
            width: 20%;
            transition: width 0.3s ease;
        }

        .caixa-pergunta {
            background: #f0f9ff;
            border-left: 4px solid #0088cc;
            padding: 15px 20px;
            border-radius: 0 12px 12px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .caixa-pergunta h3 {
            margin: 0;
            color: #0369a1;
            font-size: 1.15rem;
        }

        .btn-ouvir {
            background: #e0f2fe;
            border: none;
            color: #0369a1;
            padding: 6px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .campo-entrada {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #cbd5e1;
            border-radius: 8px;
            font-size: 1rem;
            box-sizing: border-box;
            outline: none;
            margin-bottom: 25px;
        }

        .campo-entrada:focus {
            border-color: #0088cc;
        }

        .btn-avancar {
            width: 100%;
            background: #0088cc;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-avancar:hover {
            background: #0077b5;
        }
    </style>
</head>
<body>

    <!-- CABEÇALHO PADRONIZADO -->
    <header class="aws-navbar">
        <div class="aws-nav-container">
            <div class="aws-nav-left">
                <a href="index.html" class="aws-logo">
                    <span class="logo-susi">SUSi!</span>
                </a>
                <nav class="aws-nav-links">
                    <a href="index.html">Início</a>
                    <a href="marcar-consulta.html" class="ativo">Marcar Consulta</a>
                    <a href="meus-atendimentos.html">Meus Atendimentos</a>
                    <a href="medicos.html">Médicos</a>
                </nav>
            </div>
            <div class="aws-nav-right">
                <a href="login.html" class="aws-btn-login">Criar conta / Login</a>
            </div>
        </div>
    </header>

    <main class="main-container">

        <div class="aviso-ilustrativo">
            <span>⚠️</span>
            <div><strong>Aviso Importante:</strong> As informações e médicos apresentados são meramente ilustrativos.</div>
        </div>

        <div class="card-passos">
            <div class="progresso-header">
                <span>Passo 1 de 5</span>
                <span>20% Concluído</span>
            </div>
            <div class="barra-progresso-fundo">
                <div class="barra-progresso-preenchimento"></div>
            </div>

            <div class="caixa-pergunta">
                <h3>1. Quem é o paciente?</h3>
                <button class="btn-ouvir" onclick="falarTexto('Quem é o paciente?')">🔊 Ouvir</button>
            </div>

            <input type="text" class="campo-entrada" placeholder="Digite o Nome Completo Aqui...">

            <button class="btn-avancar">Avançar →</button>
        </div>

    </main>

    <script>
        function falarTexto(texto) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(texto);
                utterance.lang = 'pt-BR';
                window.speechSynthesis.speak(utterance);
            }
        }
    </script>
</body>
</html>
